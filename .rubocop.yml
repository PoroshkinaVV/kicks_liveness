---
plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'exe/**/*'
    - 'gemfiles/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 140
  AllowedPatterns: ['\A#']

Metrics/MethodLength:
  Max: 30

# Two classes are deliberately longer than the default, and neither can be
# split without losing something real. Heartbeat is the whole filesystem
# contract in the one file the probe is allowed to load, so moving a part of it
# out would cost the probe a require. Monitor is a single tick loop with the
# logging rules that go with it, and a decision split across two files is
# harder to follow than a long one in a single place.
Metrics/ClassLength:
  Exclude:
    - 'lib/kicks_liveness/heartbeat.rb'
    - 'lib/kicks_liveness/monitor.rb'

RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 15

# The probe is a script, not a class: its only contract with the kubelet is an
# exit code and stdout, so the spec describes process behaviour, not a constant.
RSpec/DescribeClass:
  Exclude:
    - 'spec/probe_spec.rb'
