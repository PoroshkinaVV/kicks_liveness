name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Tag matches gem version and belongs to main
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          case "$RELEASE_TAG" in
            v?*) ;;
            *) echo 'Release tag must start with v'; exit 1 ;;
          esac
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$commit" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]; then
            echo 'Release tag no longer matches the triggering commit'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag $RELEASE_TAG does not point to a commit on main"
            exit 1
          fi
          git checkout --detach "$commit"
          tag="${RELEASE_TAG#v}"
          version="$(ruby -Ilib -r kicks_liveness/version -e 'print KicksLiveness::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "tag $RELEASE_TAG does not match KicksLiveness::VERSION $version"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    name: gate (ruby ${{ matrix.ruby }}, ${{ matrix.appraisal }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.4'
            appraisal: kicks_current
          - ruby: '3.4'
            appraisal: sneakers_current
          - ruby: '3.1'
            appraisal: kicks_3_0
          - ruby: '3.1'
            appraisal: sneakers_2_11
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: release-${{ matrix.appraisal }}

      - run: bundle exec rake

  package:
    name: Package smoke test
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Build, install, and run the packaged executable
        run: |
          gem build kicks_liveness.gemspec
          install_root="$RUNNER_TEMP/kicks-liveness-package"
          GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" gem install ./kicks_liveness-*.gem --install-dir "$install_root/gems" --bindir "$install_root/bin" --ignore-dependencies --no-document
          marks_dir="$RUNNER_TEMP/kicks-liveness-marks"
          KICKS_LIVENESS_DIR="$marks_dir" GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" ruby -r kicks_liveness/heartbeat -e 'heartbeat = KicksLiveness::Heartbeat.new; heartbeat.declare!(1); heartbeat.touch!(0)'
          output="$(KICKS_LIVENESS_DIR="$marks_dir" GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" "$install_root/bin/kicks-liveness")"
          test "$output" = '1 process(es) healthy'

  push:
    name: Push gem to RubyGems.org
    needs: [validate, package]
    runs-on: ubuntu-latest

    # Must match the trusted publisher's Environment field on RubyGems.org.
    environment: release

    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: kicks

      # Keep build, signing and push in separate processes: release-gem's
      # RUBYOPT preload activates default OpenSSL before Bundler (#28).
      - run: bundle exec rake build

      - name: Sign the release gem
        run: |
          gem_file="pkg/kicks_liveness-${RELEASE_VERSION}.gem"
          gem exec sigstore-cli:0.2.3 sign "$gem_file" --bundle "$gem_file.sigstore.json"

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the signed gem
        run: |
          gem_file="pkg/kicks_liveness-${RELEASE_VERSION}.gem"
          gem push "$gem_file" --attestation "$gem_file.sigstore.json"

      - name: Wait for release to propagate
        run: gem exec rubygems-await "pkg/kicks_liveness-${RELEASE_VERSION}.gem"
