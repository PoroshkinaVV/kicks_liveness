name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Tag matches gem version and belongs to main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -Ilib -r kicks_liveness/version -e 'print KicksLiveness::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match KicksLiveness::VERSION ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

  gate:
    name: gate (ruby ${{ matrix.ruby }}, ${{ matrix.appraisal }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.4'
            appraisal: kicks_current
          - ruby: '3.4'
            appraisal: sneakers_current
          - ruby: '3.1'
            appraisal: kicks_3_0
          - ruby: '3.1'
            appraisal: sneakers_2_11
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: release-${{ matrix.appraisal }}

      - run: bundle exec rake

  package:
    name: Package smoke test
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Build, install, and run the packaged executable
        run: |
          gem build kicks_liveness.gemspec
          install_root="$RUNNER_TEMP/kicks-liveness-package"
          GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" gem install ./kicks_liveness-*.gem --install-dir "$install_root/gems" --bindir "$install_root/bin" --ignore-dependencies --no-document
          marks_dir="$RUNNER_TEMP/kicks-liveness-marks"
          KICKS_LIVENESS_DIR="$marks_dir" GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" ruby -r kicks_liveness/heartbeat -e 'heartbeat = KicksLiveness::Heartbeat.new; heartbeat.declare!(1); heartbeat.touch!(0)'
          output="$(KICKS_LIVENESS_DIR="$marks_dir" GEM_HOME="$install_root/gems" GEM_PATH="$install_root/gems" "$install_root/bin/kicks-liveness")"
          test "$output" = '1 process(es) healthy'

  push:
    name: Push gem to RubyGems.org
    needs: package
    runs-on: ubuntu-latest

    # Must match the trusted publisher's Environment field on RubyGems.org.
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: kicks
      - uses: rubygems/release-gem@v1
