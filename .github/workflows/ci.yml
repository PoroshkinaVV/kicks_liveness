name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    # The gem declares neither `kicks` nor `sneakers` as a dependency, so the
    # suite has to pass against both: Appraisal defines one Gemfile for each.
    # They also drag in different Bunny dependency lines, so this matrix checks
    # that the predicate finds the same in-memory API on either one.
    name: spec (ruby ${{ matrix.ruby }}, ${{ matrix.appraisal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', 'head']
        appraisal: [kicks_current, sneakers_current]
        exclude:
          - ruby: head
            appraisal: sneakers_current
    continue-on-error: ${{ matrix.ruby == 'head' }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.appraisal }}

      - run: bundle exec rspec

  floor:
    name: floor (${{ matrix.appraisal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        appraisal: [kicks_3_0, sneakers_2_11]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: ${{ matrix.appraisal }}

      - run: bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: kicks

      - run: bundle exec appraisal generate

      - name: Generated gemfiles match Appraisals
        run: |
          git diff --exit-code -- gemfiles
          untracked="$(git ls-files --others --exclude-standard -- gemfiles)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "gemfiles/ has files Appraisals generated but git does not track; commit them"
            exit 1
          fi

      - run: bundle exec rubocop

  yard:
    # The gemspec's `documentation_uri` points at rubydoc.info, which rebuilds
    # from `.yardopts` when the gem is pushed, so a broken page ships silently.
    # Both ways that happens — a mistyped tag dropping a return value, a renamed
    # file still listed in `.yardopts` dropping the whole page — are YARD
    # warnings rather than errors, which is why the gate is --fail-on-warning.
    # Coverage is deliberately not the check: `yard stats` counts whether a
    # comment exists, not whether it renders, and reports 100% through both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: kicks

      - run: bundle exec yard doc --fail-on-warning
